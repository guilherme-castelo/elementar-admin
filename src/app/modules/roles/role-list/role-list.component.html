<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Gerenciamento de Cargos</h1>
    <a
      *ngIf="permissionService.hasPermission('role:manage')"
      mat-flat-button
      color="primary"
      routerLink="new"
    >
      <mat-icon>add</mat-icon> Novo Cargo
    </a>
  </div>

  <div class="mat-elevation-z2 rounded-lg overflow-hidden bg-white">
    <table mat-table [dataSource]="roles" class="w-full">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let role">#{{ role.id }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let role">
          <div class="font-medium">{{ role.name }}</div>
        </td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let role" class="text-gray-500">
          {{ role.description || "-" }}
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let role">
          <button
            *ngIf="permissionService.hasPermission('role:manage')"
            mat-icon-button
            color="accent"
            [routerLink]="[role.id, 'edit']"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            *ngIf="permissionService.hasPermission('role:manage')"
            mat-icon-button
            color="warn"
            (click)="deleteRole(role.id)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td
          class="mat-cell text-center py-8 text-gray-500"
          [attr.colspan]="displayedColumns.length"
        >
          Nenhum cargo encontrado.
        </td>
      </tr>
    </table>
  </div>
</div>
